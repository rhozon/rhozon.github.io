<a id="rh-top" href="#" aria-label="Back to top" title="Back to top">&#8593;</a>
<script>
(function () {
  var btn = document.getElementById('rh-top');
  if (!btn) return;
  function toggle() {
    if (window.scrollY > 600) { btn.classList.add('show'); }
    else { btn.classList.remove('show'); }
  }
  window.addEventListener('scroll', toggle, { passive: true });
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  toggle();
  // imagens fora da primeira dobra carregam sob demanda
  document.querySelectorAll('img').forEach(function (img, i) {
    if (i > 0 && !img.hasAttribute('loading')) { img.setAttribute('loading', 'lazy'); }
    if (!img.hasAttribute('decoding')) { img.setAttribute('decoding', 'async'); }
    if (!img.getAttribute('alt')) { img.setAttribute('alt', ''); }
  });
})();
</script>
<script>
// EN/PT no menu leva à mesma página na outra língua, quando ela existe
(function () {
  var links = document.querySelectorAll('.navbar a.nav-link');
  var lang = null;
  for (var i = 0; i < links.length; i++) {
    var t = links[i].textContent.trim();
    if (t === 'EN' || t === 'PT') { lang = links[i]; break; }
  }
  if (!lang || !window.fetch || location.protocol === 'file:') return;
  var toPt = lang.textContent.trim() === 'PT';
  var base = lang.href.replace(toPt ? /pt\/(index\.html)?$/ : /(index\.html)?$/, '');
  var here = location.origin + location.pathname;
  if (here.indexOf(base) !== 0) return;
  var rel = here.slice(base.length);
  if (rel === 'cv.html') return; // o CV só existe em inglês
  var target = toPt ? base + 'pt/' + rel : base + rel.replace(/^pt\//, '');
  fetch(target, { method: 'HEAD' }).then(function (r) {
    if (r.ok) { lang.href = target; }
  }).catch(function () {});
})();
</script>
